<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل التجربة</title>
<style>
  :root { --bg:#faf6ec; --card:#fff; --text:#1f2430; --muted:#555b6b; --line:#d8d2c2; --accent:#1d4e89; --good:#256b45; --warn:#8a4b08; --warn-bg:#fdefd8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.7 "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
  header { display:flex; gap:1rem; align-items:center; padding:.6rem 1rem; background:var(--card); border-bottom:1px solid var(--line); }
  header b { color:var(--accent); } header .spacer { flex:1; } header a { color:var(--muted); }
  main { max-width:46rem; margin:0 auto; padding:1.5rem 1rem 4rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:1.2rem; margin-bottom:1rem; }
  label { display:block; margin-bottom:.9rem; font-weight:bold; }
  input, select { font:inherit; width:100%; padding:.5rem .7rem; margin-top:.25rem; border:2px solid var(--line); border-radius:8px; background:#fff; }
  label.check { display:flex; gap:.6rem; align-items:center; font-weight:normal; } label.check input { width:auto; margin:0; }
  button { font:inherit; padding:.6rem 1.3rem; border-radius:999px; border:2px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; font-weight:bold; }
  button.rec { background:#b3261e; border-color:#b3261e; color:#fff; font-weight:bold; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; flex-wrap:wrap; gap:.7rem; align-items:center; }
  .word { font-family:"Simplified Arabic","Noto Naskh Arabic","Traditional Arabic",serif; font-size:clamp(3.5rem,16vw,6.5rem); font-weight:bold; text-align:center; line-height:2; margin:0; }
  .muted { color:var(--muted); } .error { color:var(--warn); background:var(--warn-bg); padding:.5rem .8rem; border-radius:8px; }
  .bar { height:.6rem; background:var(--line); border-radius:999px; overflow:hidden; margin:.3rem 0 1rem; } .bar span { display:block; height:100%; background:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:.95rem; } th, td { padding:.35rem .4rem; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; }
  td.ar { font-family:"Simplified Arabic","Noto Naskh Arabic",serif; font-size:1.3rem; } td input { width:8rem; font-family:"Simplified Arabic","Noto Naskh Arabic",serif; font-size:1.2rem; }
  tr.changed td { background:var(--warn-bg); } audio { height:2rem; width:11rem; }
  .hidden { display:none; }
</style>
</head>
<body>
<header><b>تسجيل التجربة (للبالغين فقط)</b><span class="spacer"></span><a href="#">جلسة</a><a href="#review">مراجعة التسجيلات</a></header>
<main id="app"></main>
<script>
const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const app = document.getElementById("app");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (ch) => `&#${ch.charCodeAt(0)};`);
let state = { items: [], clips: [], participants: [] };
let stream = null;

async function load() { state = await (await fetch("/api/state")).json(); }
async function post(url, body, type = "application/json") {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": type }, body: type === "application/json" ? JSON.stringify(body) : body });
  const data = await r.json(); if (!r.ok) throw new Error(data.error || r.status); return data;
}
async function mic() { stream ??= await navigator.mediaDevices.getUserMedia({ audio: true }); return stream; }

/** One recording: start() then stop() resolves with the clip. */
function recorder() {
  let rec, chunks;
  return {
    async start() { chunks = []; rec = new MediaRecorder(await mic()); rec.ondataavailable = (e) => chunks.push(e.data); rec.start(); },
    stop() { return new Promise((done) => { rec.onstop = () => done(new Blob(chunks, { type: rec.mimeType })); rec.stop(); }); },
  };
}

/** The same shuffled card order every time for a code, so an interrupted session resumes where it stopped. */
function order(code) {
  let seed = [...code].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rand = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 2 ** 32);
  const cards = state.items.map((_, i) => i + 1);
  for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
  return cards;
}

function start() {
  app.replaceChildren($(`<div>
    <h1>جلسة جديدة</h1>
    <p class="muted">لا تُكتب أسماء هنا. استمارة الموافقة الموقّعة تبقى ورقية لدى الباحث.</p>
    <div class="card">
      <label>رمز المشارك <input id="code" placeholder="p01" dir="ltr"></label>
      <label>الفئة العمرية <select id="age"><option value="">اختر…</option><option>18–24</option><option>25–34</option><option>35–49</option><option>50+</option></select></label>
      <label>اللهجة <input id="dialect" placeholder="مثل: كويتية"></label>
      <label class="check"><input type="checkbox" id="consent"> المشارك بالغ ووقّع استمارة الموافقة</label>
      <div class="row"><button id="test">اختبر الميكروفون</button><span id="testnote" class="muted"></span></div>
    </div>
    <p id="err" class="error hidden"></p>
    <button class="primary" id="go">ابدأ البطاقات</button>
  </div>`));
  const r = recorder();
  document.getElementById("test").onclick = async (e) => {
    const note = document.getElementById("testnote");
    try { e.target.disabled = true; note.textContent = "تكلّم الآن (ثانيتان)…"; await r.start();
      await new Promise((ok) => setTimeout(ok, 2000)); const clip = await r.stop();
      note.textContent = "يُعاد الآن ما سُجّل."; new Audio(URL.createObjectURL(clip)).play();
    } catch { note.textContent = "الميكروفون محجوب: اسمح به في المتصفح."; } finally { e.target.disabled = false; }
  };
  document.getElementById("go").onclick = async () => {
    const code = document.getElementById("code").value.trim().toLowerCase();
    try {
      await post("/api/participant", { code, age_band: document.getElementById("age").value,
        dialect: document.getElementById("dialect").value, consent: document.getElementById("consent").checked });
      await mic(); await load(); session(code);
    } catch (e) { const err = document.getElementById("err"); err.textContent = "تحقّق من الرمز (مثل p01) والفئة العمرية والموافقة، واسمح بالميكروفون."; err.classList.remove("hidden"); }
  };
}

function session(code) {
  const done = new Set(state.clips.filter((c) => c.participant === code).map((c) => Number(c.card)));
  const cards = order(code).filter((c) => !done.has(c));
  const total = state.items.length;
  let clip = null; const r = recorder();
  if (!cards.length) return finished(code);
  const card = cards[0], item = state.items[card - 1], n = total - cards.length + 1;
  app.replaceChildren($(`<div>
    <p class="muted">${code} · البطاقة ${n} من ${total}</p>
    <div class="bar"><span style="width:${(n - 1) / total * 100}%"></span></div>
    <div class="card"><p class="word">${item.said}</p></div>
    <p class="muted">اقرأ الكلمة كما هي مكتوبة تمامًا، بصوت عادي. اترك ثانية صمت قبل الكلام وبعده.</p>
    <div class="row">
      <button class="primary" id="rec">● سجّل</button>
      <button id="play" disabled>▶ استمع</button>
      <button class="primary" id="save" disabled>احفظ والتالي</button>
      <span id="note" class="muted"></span>
    </div>
  </div>`));
  const rec = document.getElementById("rec"), play = document.getElementById("play"), save = document.getElementById("save"), note = document.getElementById("note");
  let recording = false;
  rec.onclick = async () => {
    if (!recording) { await r.start(); recording = true; rec.textContent = "■ أوقف"; rec.className = "rec"; play.disabled = save.disabled = true; note.textContent = "نسجّل…"; return; }
    clip = await r.stop(); recording = false; rec.textContent = "● أعد التسجيل"; rec.className = ""; play.disabled = save.disabled = false;
    note.textContent = `${(clip.size / 1024).toFixed(0)} KB`;
  };
  play.onclick = () => new Audio(URL.createObjectURL(clip)).play();
  save.onclick = async () => {
    save.disabled = true; note.textContent = "نحفظ…";
    try { await post(`/api/clip?code=${code}&card=${card}`, clip, clip.type || "audio/webm"); await load(); session(code); }
    catch (e) { note.textContent = "لم يُحفظ: " + e.message + ". أعد التسجيل."; save.disabled = false; }
  };
}

function finished(code) {
  app.replaceChildren($(`<div><h1>انتهت الجلسة</h1><p>سُجّلت البطاقات الـ ${state.items.length} للمشارك ${code}. شكرًا!</p>
    <div class="row"><button class="primary" onclick="location.hash='#review'">مراجعة التسجيلات</button><button onclick="start()">جلسة جديدة</button></div></div>`));
}

function review() {
  const byCode = Object.groupBy(state.clips, (c) => c.participant);
  const root = $(`<div><h1>مراجعة التسجيلات</h1>
    <p class="muted">استمع إلى كل تسجيل. إذا قرأ المشارك الكلمة بشكل مختلف عمّا طُلب، اكتب ما قاله فعلًا (مشكولًا) في خانة «قال». هذا هو حكم المستمع البشري الذي تُقارن به التطبيق.</p>
    <p class="muted">التحليل (من مجلد ml): <code dir="ltr">.venv/Scripts/python pilot.py data/pilot/clips.csv</code></p></div>`);
  if (!state.clips.length) root.append($(`<p>لا توجد تسجيلات بعد.</p>`));
  for (const [code, clips] of Object.entries(byCode)) {
    const person = state.participants.find((p) => p.code === code) || {};
    const box = $(`<div class="card"><div class="row"><b>${esc(code)}</b><span class="muted">${esc(person.age_band)} · ${esc(person.dialect)} · ${esc(person.date)} · ${clips.length} من ${state.items.length}</span>
      <span style="flex:1"></span><button class="del">احذف بيانات هذا المشارك</button></div>
      <table><thead><tr><th>#</th><th>الهدف</th><th>طُلب</th><th>التسجيل</th><th>قال</th></tr></thead><tbody></tbody></table></div>`);
    box.querySelector(".del").onclick = async () => {
      if (!confirm(`حذف كل تسجيلات ${code} وبياناته نهائيًا؟ لا يمكن التراجع.`)) return;
      await post("/api/delete", { code }); await load(); review();
    };
    const body = box.querySelector("tbody");
    for (const c of clips) {
      const name = c.path.split("/").pop();
      const tr = $(`<tr class="${c.said !== c.asked ? "changed" : ""}"><td>${esc(c.card)}</td><td class="ar">${esc(c.target)}</td><td class="ar">${esc(c.asked)}</td>
        <td><audio controls preload="none" src="/audio/${esc(name)}"></audio></td><td><input value="${esc(c.said)}"></td></tr>`);
      tr.querySelector("input").onchange = async (e) => {
        await post("/api/said", { path: c.path, said: e.target.value }); c.said = e.target.value.trim(); tr.className = c.said !== c.asked ? "changed" : "";
      };
      body.append(tr);
    }
    root.append(box);
  }
  app.replaceChildren(root);
}

async function route() { await load(); location.hash === "#review" ? review() : start(); }
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
